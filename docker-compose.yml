services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - public_net
      - app_net
    depends_on:
      - frontend
      - catalog-service

  frontend:
    build: ./frontend
    networks:
      - public_net

  catalog-service:
    build: ./catalog-service
    environment:
      DB_HOST: postgres-master
      REDIS_HOST: redis
      RABBIT_HOSTS: "rabbitmq1,rabbitmq2,rabbitmq3"
    networks:
      - app_net
      - data_net
    depends_on:
      - postgres-master
      - redis
      - rabbitmq1

  notification-consumer:
    build: ./notification-consumer
    environment:
      RABBIT_HOSTS: "rabbitmq1,rabbitmq2,rabbitmq3"
    networks:
      - data_net
    depends_on:
      - rabbitmq1

  postgres-master:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_keep_size=64MB"]
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
      - pg_master:/var/lib/postgresql/data
    networks:
      - data_net

  postgres-standby:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: apppass
    volumes:
      - ./db/standby-entrypoint.sh:/standby-entrypoint.sh:ro
      - pg_standby:/var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    networks:
      - data_net
    depends_on:
      - postgres-master

  redis:
    image: redis:7-alpine
    networks:
      - data_net

  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: minishopcookie
    networks:
      - data_net

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: minishopcookie
    networks:
      - data_net

  rabbitmq3:
    image: rabbitmq:3.13-management
    hostname: rabbitmq3
    environment:
      RABBITMQ_ERLANG_COOKIE: minishopcookie
    networks:
      - data_net

volumes:
  pg_master:
  pg_standby:

networks:
  public_net:
  app_net:
  data_net:
    internal: true
